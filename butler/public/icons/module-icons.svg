		<g style="fill: none; stroke: var(--duotone-dark, var(--butler-ink)); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round"><path d="M4 11.4c0 1.7 3.6 3 8 3s8-1.3 8-3" /><path d="M4 16.4c0 1.7 3.6 3 8 3s8-1.3 8-3" /></g>
